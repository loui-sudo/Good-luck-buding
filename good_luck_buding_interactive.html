<!doctype html>
<html><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#24153d">
<title>Good Luck Kitty 🐱</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;overflow:hidden;background:linear-gradient(145deg,#24153d,#63385f)}
.card{position:relative;width:min(92vw,600px);min-height:620px;padding:28px 18px;text-align:center;overflow:hidden;border-radius:32px;background:#fff5fa;box-shadow:0 20px 60px #0005}
.decor{position:absolute;inset:0;pointer-events:none}.spark{position:absolute;animation:twinkle 2s infinite alternate}
@keyframes twinkle{from{opacity:.25;transform:scale(.7)}to{opacity:1;transform:scale(1.15)}}
.cat{display:block;margin:5px auto 8px;width:190px;height:190px;border:0;background:none;font-size:145px;line-height:190px;cursor:pointer;transition:.18s}
.cat:active{transform:scale(.86) rotate(-5deg)}
h1{margin:4px 0;font-size:clamp(48px,12vw,76px);color:#7d3f68;line-height:1;animation:pulse 2s infinite}
@keyframes pulse{50%{transform:scale(1.035)}}
.name{font-size:clamp(24px,6vw,34px);font-weight:800;color:#d15b82;margin-top:10px}.sub{font-size:clamp(23px,6vw,34px);font-weight:800;color:#3e2949;margin:18px 0 10px}
.msg{min-height:34px;color:#d15b82;font-size:21px;font-weight:700}.hint{color:#59425e;font-size:16px;margin-top:12px}
.reset{margin-top:20px;padding:12px 20px;border:0;border-radius:999px;background:#efb5cf;color:#5d3151;font-size:16px;font-weight:700}
.heart{position:absolute;pointer-events:none;font-size:28px;animation:up 1.7s ease-out forwards}
@keyframes up{0%{opacity:0;transform:translate(-50%,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(-50%,-180px) scale(1.4)}}
.paw{font-size:25px;margin:0 5px}
</style></head>
<body>
<div class="card" id="card">
<div class="decor" id="decor"></div>
<div><span class="paw">🐾</span><span class="paw">✨</span><span class="paw">🐾</span></div>
<button class="cat" id="cat" type="button" aria-label="Tap the cat for good luck">🐱</button>
<div class="name">FOR BUDING 💗</div><h1>GOOD LUCK!</h1>
<div class="sub">ON YOUR TESTS! 🐾</div>
<div class="msg" id="msg">🐾 TAP THE CAT! 🐾</div>
<div class="hint">Believe in yourself and do your best! ✨</div>
<button class="reset" id="reset">Reset the kitty</button>
</div>
<script>
const card=document.getElementById("card"),cat=document.getElementById("cat"),msg=document.getElementById("msg"),decor=document.getElementById("decor");
const words=["You've got this! 💪","Believe in yourself! ✨","Meow means GOOD LUCK! 🐱","You can do it! 💗","Go ace that test! 📚","Sending you cat luck! 🍀🐾"];
let taps=0;
for(let i=0;i<22;i++){let s=document.createElement("span");s.className="spark";s.textContent=i%2?"♥":"✦";s.style.left=Math.random()*100+"%";s.style.top=Math.random()*100+"%";s.style.fontSize=12+Math.random()*14+"px";s.style.animationDelay=Math.random()*2+"s";s.style.color=i%2?"#e5a8c5":"#f1b0c9";decor.appendChild(s)}
function celebrate(){let a=cat.getBoundingClientRect(),b=card.getBoundingClientRect();for(let i=0;i<12;i++){let h=document.createElement("span");h.className="heart";h.textContent=["💗","💖","✨","🐾","💕"][i%5];h.style.left=a.left-b.left+a.width/2+(Math.random()-.5)*100+"px";h.style.top=a.top-b.top+a.height/2+(Math.random()-.5)*30+"px";h.style.animationDelay=Math.random()*.2+"s";card.appendChild(h);setTimeout(()=>h.remove(),2000)}}
cat.addEventListener("pointerup",(event)=>{ event.preventDefault();taps++;msg.textContent=words[(taps-1)%words.length];cat.style.transform="scale(1.12) rotate("+(taps%2?-6:6)+"deg)";setTimeout(()=>cat.style.transform="",180);celebrate(); });
document.getElementById("reset").addEventListener("click",()=>{taps=0;msg.textContent="🐾 TAP THE CAT! 🐾";cat.style.transform="";document.querySelectorAll(".heart").forEach(h=>h.remove())};

card.addEventListener("pointerdown",(event)=>{
  if(event.target===cat || event.target===document.getElementById("reset")) return;
  const r=card.getBoundingClientRect();
  const x=event.clientX-r.left, y=event.clientY-r.top;
  for(let i=0;i<6;i++){
    const h=document.createElement("span");
    h.className="heart";
    h.textContent=["✨","💗","🐾"][i%3];
    h.style.left=(x+(Math.random()-.5)*60)+"px";
    h.style.top=(y+(Math.random()-.5)*30)+"px";
    card.appendChild(h);
    setTimeout(()=>h.remove(),2000);
  }
});
</script></body></html>
